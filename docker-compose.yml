services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: b2b
      POSTGRES_PASSWORD: b2b
      POSTGRES_DB: b2b
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2b -d b2b"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://b2b:b2b@db:5432/b2b
      # Override in a .env file next to this compose file; required in production.
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      JWT_EXPIRES_IN: 8h
      LOG_LEVEL: info
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
