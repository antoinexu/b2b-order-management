name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      # Real Postgres for tests/concurrency.test.ts; the other suites use in-process PGlite.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: b2b
          POSTGRES_PASSWORD: b2b
          POSTGRES_DB: b2b_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U b2b -d b2b_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://b2b:b2b@localhost:5432/b2b_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: OpenAPI document is up to date
        run: |
          npm run openapi:export
          git diff --exit-code docs/openapi.json || (echo "::error::docs/openapi.json is stale. Run 'npm run openapi:export' and commit." && exit 1)

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install API dependencies (e2e runs the real API)
        run: npm ci
        working-directory: .
      - run: npm ci
      - name: Generated API types match the OpenAPI contract
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts || (echo "::error::Frontend API types are stale. Run 'npm run gen:api' in web/ and commit." && exit 1)
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t b2b-order-management:ci .
      - name: Smoke test with Postgres
        run: |
          export JWT_SECRET="$(openssl rand -hex 48)"
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          docker compose up -d --build --wait
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3000/health
          curl --fail -X POST http://localhost:3000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"organizationName":"CI Org","name":"CI","email":"ci@example.com","password":"Password123!"}'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
