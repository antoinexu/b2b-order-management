name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! For security vulnerabilities, please follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Requests, clicks or commands that trigger the bug. Remove any secrets or real customer data.
      placeholder: |
        1. Sign in as sales@acme.example
        2. Create a quote with ...
        3. POST /api/v1/quotes/{id}/send
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API
        - Web app
        - Quote PDFs
        - Email
        - Deployment / Docker
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How are you running it?
      options:
        - npm run dev:memory (in-memory database)
        - npm run dev with PostgreSQL
        - Docker Compose
        - Render / other hosting
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or 215c07d
  - type: textarea
    id: logs
    attributes:
      label: Logs and error responses
      description: Relevant API log lines or error JSON. Remove tokens and passwords.
      render: shell
